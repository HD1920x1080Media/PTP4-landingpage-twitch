# Gemeinsame Security-Header.
# Per `include` in jeden location-Block eingebunden, weil nginx beim Setzen
# eines eigenen add_header in einem location-Block ALLE vom server-Block
# geerbten add_header verwirft. Ohne dieses include würden die Header in den
# locations mit Cache-Control fehlen.
#
# Bewusst ohne strenge Content-Security-Policy, um die eingebetteten
# Twitch-/YouTube-Player und Inline-Bootstrap-Skripte nicht zu brechen.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
