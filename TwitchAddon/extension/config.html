<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanalpunkte – Aktivierung</title>
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="config.css">
</head>
<body>
  <h1>🪙 Kanalpunkte Extension</h1>

  <div class="status-bar wait" id="authStatus">⏳ Authentifizierung…</div>

  <div id="mainPanel" class="hidden">
    <div class="toolbar">
      <h2>Rewards (aktivieren/deaktivieren)</h2>
      <button id="syncBtn" class="btn btn-primary">📝 Bearbeite auf meiner Website</button>
    </div>

    <div id="rewardList" class="reward-list">
      <div class="state-msg">Lade…</div>
    </div>

    <p class="info">
      Neue Rewards hinzufügen, bearbeiten oder löschen:
      <a href="https://hd1920x1080.de/admin/rewards" target="_blank" rel="noopener noreferrer">
        → Gehe zum Admin-Panel
      </a>
    </p>
  </div>

  <script src="config.js"></script>
</body>
</html>
